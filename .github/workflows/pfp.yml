name: PFP Auto Swap

on:
  schedule:
    - cron: '*/5 11-12 * * 3'
    - cron: '*/5 10-11 * * 4'
    - cron: '*/5 11-12 * * 5'
    - cron: '*/5 10-11 * * 6'
    - cron: '*/5 10-11 * * 0'
    - cron: '*/5 19-20 * * 3'
    - cron: '*/5 18-19 * * 4'
    - cron: '*/5 19-20 * * 5'
    - cron: '*/5 18-19 * * 6'
    - cron: '*/5 18-19 * * 0'
  workflow_dispatch:

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install telethon
      - name: Run swap script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
        run: python swap_pfp.py auto
