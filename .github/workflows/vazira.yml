name: Vazira PFP Swap

on:
  schedule:
    - cron: '*/5 7-9 * * 0,1'
    - cron: '*/5 15-17 * * 0,1'
    - cron: '*/5 11-13 * * 5'
    - cron: '*/5 19-21 * * 5'
    - cron: '*/5 11-13 * * 6'
    - cron: '*/5 19-21 * * 6'
  workflow_dispatch:

concurrency:
  group: pfp-vazira
  cancel-in-progress: false

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install telethon
      - name: Run swap script
        env:
          API_ID_V: ${{ secrets.API_ID_V }}
          API_HASH_V: ${{ secrets.API_HASH_V }}
          SESSION_STRING_V: ${{ secrets.SESSION_STRING_V }}
        run: python swap_vazira.py auto
