name: Vazira PFP Swap

on:
  schedule:
    - cron: '*/5 7-8 * * 0,1'
    - cron: '*/5 15-16 * * 0,1'
    - cron: '*/5 11-12 * * 5'
    - cron: '*/5 19-20 * * 5'
    - cron: '*/5 11-12 * * 6'
    - cron: '*/5 19-20 * * 6'
  workflow_dispatch:

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install telethon
      - name: Run swap script
        env:
          API_ID_V: ${{ secrets.API_ID_V }}
          API_HASH_V: ${{ secrets.API_HASH_V }}
          SESSION_STRING_V: ${{ secrets.SESSION_STRING_V }}
        run: python swap_vazira.py auto

