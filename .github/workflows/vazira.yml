name: Vazira PFP Swap

on:
  schedule:
    - cron: '0 8,12,16,20 * * 0,1,5,6'
  workflow_dispatch:

concurrency:
  group: pfp-vazira
  cancel-in-progress: false

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install telethon
      - name: Run swap script
        env:
          API_ID_V: ${{ secrets.API_ID_V }}
          API_HASH_V: ${{ secrets.API_HASH_V }}
          SESSION_STRING_V: ${{ secrets.SESSION_STRING_V }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
        run: python swap_vazira.py auto
